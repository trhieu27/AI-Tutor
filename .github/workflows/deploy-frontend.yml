name: 🚀 Deploy Frontend to EC2

on:
  push:
    branches: [develop]
    paths:
      - 'ai-tutor-frontend/**'
      - 'nginx/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-frontend.yml'

  # Cho phép chạy thủ công từ GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Frontend to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: 📦 Deploy Frontend to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # Thêm host key để tránh prompt xác nhận
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

          ssh $EC2_USER@$EC2_HOST << 'ENDSSH'
            set -e
            echo "📁 Navigating to project directory..."
            cd ~/DoAn

            echo "⬇️  Pulling latest code..."
            git pull origin $(git rev-parse --abbrev-ref HEAD)

            echo "🔨 Building and restarting frontend..."
            docker compose -f docker-compose.prod.yml build --no-cache frontend
            docker compose -f docker-compose.prod.yml up -d --force-recreate frontend nginx

            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f

            echo "✅ Health check..."
            sleep 15
            curl -f http://localhost || (echo "❌ Health check failed!" && exit 1)

            echo "🎉 Frontend deployment successful!"
          ENDSSH

      - name: 📢 Notify on failure
        if: failure()
        run: echo "::error::Frontend deployment to EC2 failed! Check the logs above."

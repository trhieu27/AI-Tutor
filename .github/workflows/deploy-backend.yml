name: 🚀 Deploy Backend to EC2

on:
  push:
    branches: [develop]
    paths:
      - 'ai-tutor-backend/**'
      - 'nginx/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-backend.yml'

  # Cho phép chạy thủ công từ GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: 📦 Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # Thêm host key để tránh prompt xác nhận
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

          ssh $EC2_USER@$EC2_HOST << 'ENDSSH'
            set -e

            echo "📁 Checking project directory..."
            if [ ! -d ~/AI-Tutor ]; then
              echo "📥 Cloning repository..."
              git clone https://github.com/trhieu27/AI-Tutor.git ~/AI-Tutor
              cd ~/AI-Tutor
              git checkout develop
            else
              cd ~/AI-Tutor
              echo "⬇️  Syncing with remote..."
              git remote prune origin
              git fetch --prune origin
              git checkout develop
              git reset --hard origin/develop
            fi

            echo "🔧 Ensuring Docker Compose plugin..."
            if ! sudo docker compose version &>/dev/null 2>&1; then
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
                -o /tmp/docker-compose-tmp
              sudo mv /tmp/docker-compose-tmp /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              sudo systemctl restart docker
              sleep 3
              echo "Docker Compose: $(sudo docker compose version)"
            fi

            echo "🔨 Building and restarting backend..."
            sudo docker compose -f docker-compose.prod.yml build --no-cache backend
            sudo docker compose -f docker-compose.prod.yml up -d --force-recreate backend nginx

            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f

            echo "✅ Health check..."
            sleep 10
            curl -f http://localhost/health || (echo "❌ Health check failed!" && exit 1)

            echo "🎉 Deployment successful!"
          ENDSSH

      - name: 📢 Notify on failure
        if: failure()
        run: echo "::error::Deployment to EC2 failed! Check the logs above."

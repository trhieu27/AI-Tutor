services:
  # -------------------------------------------------------
  # Backend FastAPI (production)
  # -------------------------------------------------------
  backend:
    build:
      context: ./ai-tutor-backend
      dockerfile: Dockerfile
    container_name: ai_tutor_backend
    restart: always
    volumes:
      - ./ai-tutor-backend/storage:/app/storage
    env_file:
      - ./ai-tutor-backend/.env
    networks:
      - ai_tutor_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # -------------------------------------------------------
  # Frontend Next.js (production)
  # -------------------------------------------------------
  frontend:
    build:
      context: ./ai-tutor-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://aitutor.click/api/v1
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: 801791613238-tqiu8qenj6uqitun0qv3emr7lda965eo.apps.googleusercontent.com
    container_name: ai_tutor_frontend
    restart: always
    networks:
      - ai_tutor_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # -------------------------------------------------------
  # Nginx Reverse Proxy
  # -------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ai_tutor_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - ai_tutor_network

networks:
  ai_tutor_network:
    name: ai_tutor_network
    driver: bridge

services:
  # -------------------------------------------------------
  # Backend FastAPI (production)
  # -------------------------------------------------------
  backend:
    build:
      context: ./ai-tutor-backend
      dockerfile: Dockerfile
    container_name: ai_tutor_backend
    restart: always
    ports:
      - "8081:8081"
    volumes:
      - ./ai-tutor-backend/storage:/app/storage
    env_file:
      - ./ai-tutor-backend/.env
    networks:
      - ai_tutor_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # -------------------------------------------------------
  # Nginx Reverse Proxy
  # -------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ai_tutor_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # SSL certs (nếu có)
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai_tutor_network

networks:
  ai_tutor_network:
    name: ai_tutor_network
    driver: bridge

# ============================================================
# Nginx config cho AI Tutor (Frontend + Backend)
# ============================================================

upstream ai_tutor_backend {
    server backend:8081;
    keepalive 32;
}

upstream ai_tutor_frontend {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 55M;
    client_body_timeout 120s;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---- API Backend ----
    location /api/ {
        proxy_pass http://ai_tutor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 60s;

        # Tắt buffering cho streaming (SSE)
        proxy_buffering off;
        proxy_cache     off;
    }

    # Health check backend (không log)
    location = /health {
        proxy_pass http://ai_tutor_backend;
        access_log off;
    }

    # ---- Frontend Next.js ----
    location / {
        proxy_pass http://ai_tutor_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
upstream ai_tutor_backend {
    server backend:8081;
    keepalive 32;
}
# Upstream riêng cho WebSocket — KHÔNG keepalive để tránh xung đột upgrade headers
upstream ai_tutor_backend_ws {
    server backend:8081;
}
upstream ai_tutor_frontend {
    server frontend:3000;
    keepalive 16;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name aitutor.click www.aitutor.click;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name aitutor.click www.aitutor.click;
    client_max_body_size 55M;
    client_body_timeout 120s;

    # SSL Certificate (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/aitutor.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aitutor.click/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── WebSocket: Real-time Notifications ──────────────────────────────────
    # Phải đặt TRƯỚC location /api/ để được match trước
    location /api/v1/ws/ {
        proxy_pass http://ai_tutor_backend_ws;  # Dùng upstream không keepalive
        proxy_http_version 1.1;

        # Hard-code WebSocket upgrade headers — không dùng map variable
        proxy_set_header Upgrade           "websocket";
        proxy_set_header Connection        "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout dài để giữ kết nối WebSocket (24h)
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 60s;

        proxy_buffering off;
        proxy_cache     off;
    }

    location /api/ {
        proxy_pass http://ai_tutor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache     off;
    }
    location = /health {
        proxy_pass http://ai_tutor_backend;
        access_log off;
    }
    location / {
        proxy_pass http://ai_tutor_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout    60s;
        proxy_connect_timeout 60s;
    }
}

# ============================================================
# Nginx config cho AI Tutor Backend
# Đặt file này tại: nginx/default.conf/default.conf
# ============================================================

# Upstream backend
upstream ai_tutor_backend {
    server backend:8081;
    keepalive 32;
}

# -------------------------------------------------------
# HTTP → HTTPS redirect (bật khi có SSL / domain)
# -------------------------------------------------------
# server {
#     listen 80;
#     server_name api.yourdomain.com;
#     return 301 https://$host$request_uri;
# }

# -------------------------------------------------------
# Main server block (HTTP, dùng khi chưa có domain/SSL)
# -------------------------------------------------------
server {
    listen 80;
    server_name _;   # Nhận mọi hostname/IP

    # Tăng limit upload file (PDF, DOCX...)
    client_max_body_size 55M;
    client_body_timeout 120s;

    # Gzip compression
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---- Proxy tất cả requests về FastAPI ----
    location / {
        proxy_pass http://ai_tutor_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Timeout dài cho streaming chat responses
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 60s;

        # Buffering: TẮT cho streaming (SSE)
        proxy_buffering       off;
        proxy_cache           off;
    }

    # Health check endpoint (không log)
    location = /health {
        proxy_pass http://ai_tutor_backend;
        access_log off;
    }
}


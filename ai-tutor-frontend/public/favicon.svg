<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded square background -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#grad)"/>

  <!-- Graduation cap -->
  <g fill="white" transform="translate(256,256) scale(1.1) translate(-256,-256)">
    <!-- Cap top (diamond shape) -->
    <polygon points="256,140 420,220 256,300 92,220"/>
    <!-- Cap body (bottom part) -->
    <path d="M152,240 v60 c0,40 46,72 104,72 s104,-32 104,-72 v-60 L256,280 Z" opacity="0.9"/>
    <!-- Tassel line -->
    <line x1="420" y1="220" x2="420" y2="340" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <!-- Tassel ball -->
    <circle cx="420" cy="348" r="14" fill="white"/>
  </g>
</svg>

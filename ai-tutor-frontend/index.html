<!doctype html>
<html lang="vi" style="background:#f8fafc">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- theme-color matches page bg → address bar consistent, no adaptive color change -->
    <meta name="theme-color" content="#f8fafc" id="theme-color-meta" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Tutor - Trợ lý học tập thông minh powered by AI" />
    <title>AI Tutor – Học thông minh hơn với AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
      (function() {
        // Default to 'light' — matches ThemeProvider's `stored ?? 'light'`
        var stored = localStorage.getItem('theme') || 'light';
        var isDark = stored !== 'light';
        var bg = isDark ? '#0a0a0a' : '#f8fafc';
        // Apply background + class before React mounts (prevents flash)
        document.documentElement.style.background = bg;
        document.documentElement.classList.toggle('dark', isDark);
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        // Always update theme-color meta (both light AND dark)
        var meta = document.getElementById('theme-color-meta');
        meta.content = bg;
        // Keep in sync when user toggles theme at runtime
        new MutationObserver(function() {
          var dark = document.documentElement.classList.contains('dark');
          var newBg = dark ? '#0a0a0a' : '#f8fafc';
          document.documentElement.style.background = newBg;
          meta.content = newBg;
        }).observe(document.documentElement, { attributeFilter: ['class'] });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

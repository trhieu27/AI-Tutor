<!doctype html>
<html lang="vi" style="background:#f8fafc">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- theme-color: controls Safari address-bar tint (iOS legacy + Android Chrome) -->
    <meta name="theme-color" content="#f8fafc" id="theme-color-meta" />
    <!-- color-scheme: tells iOS 26 Safari which chrome variant (light/dark) to render.
         This is the PRIMARY signal for status-bar text color & toolbar pill appearance.
         Value is patched immediately by the inline script below. -->
    <meta name="color-scheme" content="light" id="color-scheme-meta" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AI Tutor - Trợ lý học tập thông minh powered by AI" />
    <title>AI Tutor – Học thông minh hơn với AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
      (function() {
        // Runs synchronously before first paint — patches both meta tags and html element
        // so Safari iOS 26 reads the correct chrome color from the very first frame.
        var stored = localStorage.getItem('theme') || 'light';
        var isDark = stored !== 'light';
        var bg     = isDark ? '#0a0a0a' : '#f8fafc';
        var scheme = isDark ? 'dark' : 'light';
        document.documentElement.style.backgroundColor   = bg;
        document.documentElement.style.colorScheme  = scheme;
        document.documentElement.classList.toggle('dark', isDark);
        localStorage.setItem('theme', scheme);
        // Patch both meta tags while DOM is still blocked (guaranteed to exist)
        document.getElementById('theme-color-meta').content  = bg;
        document.getElementById('color-scheme-meta').content = scheme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

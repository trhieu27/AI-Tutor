<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!--
      JolyUI technique: two media-scoped theme-color tags so Safari picks up
      the correct chrome color even before JS runs (SSR / first paint).
      The blocking script below adds a THIRD plain tag (no media) that overrides
      both when the user has explicitly selected a theme different from their
      system preference.
    -->
    <meta name="theme-color" content="#f3f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1218" media="(prefers-color-scheme: dark)" />
    <!-- Plain tag (no media) = user-selected theme override — set by script below -->
    <meta name="theme-color" content="#f3f6f8" id="tc" />

    <meta name="color-scheme" content="light dark" id="cs" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AI Tutor - Trợ lý học tập thông minh powered by AI" />
    <title>AI Tutor – Học thông minh hơn với AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!--
      Blocking script — runs synchronously before first paint.
      Reads localStorage → patches html inline styles + meta tags so Safari iOS
      reads the correct chrome color from the very first frame.
    -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme') || 'light';
        var isDark  = stored === 'dark';
        var bg      = isDark ? '#0f1218' : '#f3f6f8';
        var scheme  = isDark ? 'dark'    : 'light';

        var root = document.documentElement;
        root.classList.toggle('dark', isDark);
        root.style.backgroundColor = bg;
        root.style.colorScheme     = scheme;

        // Safari samples BODY background for toolbar color — set it inline
        // here (before first paint) so it matches html background exactly.
        // body element exists at this point because <script> is in <head> and
        // <body> tag comes after, so we use document.body safely after DOMContentLoaded?
        // Actually body doesn't exist yet here — handled by ThemeProvider on mount.
        // But we add a style block to set body bg before CSS loads:
        var s = document.createElement('style');
        s.textContent = 'body{background-color:' + bg + '!important}';
        document.head.appendChild(s);
        // Remove the injected rule once CSS loads (ThemeProvider will take over)
        window.addEventListener('DOMContentLoaded', function() { if(s.parentNode) s.parentNode.removeChild(s); }, {once:true});

        // Plain (no-media) tag overrides the media-query tags when user has
        // explicitly selected a theme.
        document.getElementById('tc').content = bg;
        // color-scheme meta: tell Safari light/dark chrome style
        document.getElementById('cs').content = scheme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
